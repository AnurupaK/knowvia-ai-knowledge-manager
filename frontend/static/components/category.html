<section class="category-page">

    <div class="category-header">

        <div>

            <button
                class="back-btn"
                id="back-to-knowledge-base"
            >
                ← Knowledge Base
            </button>

            <h1 id="category-title">
                Category
            </h1>

            <p id="category-description">
                Manage knowledge categories.
            </p>

        </div>

        <button
            class="add-subcategory-btn"
            id="add-subcategory-btn"
        >
            + Add Category
        </button>

    </div>


    <div
        class="subcategory-cards"
        id="subcategory-cards"
    >

        <!-- Loading Animation -->
        <div
            class="page-loader"
            id="category-loader"
        >

            <div class="loader-spinner"></div>

            <p>
                Loading...
            </p>

        </div>


        <!--
            Subcategory cards will be created
            dynamically by category.js.
        -->


        <button
            class="add-subcategory-card"
            id="add-subcategory-card"
        >

            <span>+</span>

            <p>
                Add Category
            </p>

        </button>

    </div>

</section>
