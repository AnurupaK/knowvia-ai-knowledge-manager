<section class="knowledge-base-page">

    <!-- Header -->
    <div class="knowledge-header">

        <div>
            <h1>Knowledge Base</h1>

            <p>
                Manage and organize your knowledge-base categories.
            </p>
        </div>

        <button
            class="add-category-btn"
            id="add-category-btn"
        >
            + Add Category
        </button>

    </div>


    <!-- Knowledge Base Cards -->
    <div
        class="knowledge-cards"
        id="knowledge-cards"
    >

        <!-- Loading Animation -->
        <div
            class="page-loader"
            id="knowledge-base-loader"
        >

            <div class="loader-spinner"></div>

            <p>
                Loading...
            </p>

        </div>


        <!-- Add Category Card -->
        <button
            class="add-category-card"
            id="add-category-card"
        >

            <span class="add-category-plus">
                +
            </span>

            <span>
                Add Category
            </span>

        </button>

    </div>

</section>
